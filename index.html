<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - CS Web Assignment</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200 flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold leading-tight">CS Web Assignment</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Form Validation & Dynamic Data Table</p>
                    </div>
                </div>

                <!-- Navigation Links & Theme Toggle -->
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <nav class="flex bg-slate-100 dark:bg-slate-700/50 p-1 rounded-xl text-sm font-medium">
                        <a href="index.html" class="px-3 sm:px-4 py-2 rounded-lg transition-all flex items-center space-x-2 bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm font-semibold">
                            <i class="fa-solid fa-user-plus"></i>
                            <span class="hidden sm:inline">Part 1:</span> <span>Registration Form</span>
                        </a>
                        <a href="table.html" class="px-3 sm:px-4 py-2 rounded-lg transition-all flex items-center space-x-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 font-medium">
                            <i class="fa-solid fa-table"></i>
                            <span class="hidden sm:inline">Part 2:</span> <span>Data Table</span>
                        </a>
                    </nav>

                  
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- REGISTRATION FORM SECTION -->
        <section id="part-form">
            <div class="max-w-xl mx-auto bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700/60 p-6 sm:p-8">
                <div class="mb-6 border-b border-slate-100 dark:border-slate-700/80 pb-4">
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-id-card text-blue-600"></i>
                        Registration Form
                    </h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                        Fill in all fields. All inputs are validated strictly on-the-fly and on submission.
                    </p>
                </div>

                <form id="registrationForm" class="space-y-4" novalidate>
                    <!-- Name Field -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-user"></i>
                            </span>
                            <input type="text" id="name" name="name" placeholder="John Doe" 
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                        </div>
                        <p id="nameError" class="text-xs text-red-500 mt-1.5 hidden flex items-center gap-1 font-medium"></p>
                    </div>

                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" id="email" name="email" placeholder="example@domain.com"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                        </div>
                        <p id="emailError" class="text-xs text-red-500 mt-1.5 hidden flex items-center gap-1 font-medium"></p>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="password" name="password" placeholder="At least 8 characters"
                                class="w-full pl-10 pr-10 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                            <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                <i id="passwordToggleIcon" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <p id="passwordError" class="text-xs text-red-500 mt-1.5 hidden flex items-center gap-1 font-medium"></p>
                    </div>

                    <!-- Confirm Password Field -->
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-shield-halved"></i>
                            </span>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password"
                                class="w-full pl-10 pr-10 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                            <button type="button" onclick="togglePasswordVisibility('confirmPassword', 'confirmPasswordToggleIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                <i id="confirmPasswordToggleIcon" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <p id="confirmPasswordError" class="text-xs text-red-500 mt-1.5 hidden flex items-center gap-1 font-medium"></p>
                    </div>

                    <!-- Age Field -->
                    <div>
                        <label for="age" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Age</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-calendar"></i>
                            </span>
                            <input type="number" id="age" name="age" placeholder="e.g. 25" min="1" max="120"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                        </div>
                        <p id="ageError" class="text-xs text-red-500 mt-1.5 hidden flex items-center gap-1 font-medium"></p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="pt-4 flex flex-col sm:flex-row gap-3">
                        <button type="submit" class="w-full py-3 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/20 transition duration-150 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>Submit Form</span>
                        </button>
                        <button type="button" onclick="resetForm()" class="w-full sm:w-auto py-3 px-5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Reset</span>
                        </button>
                    </div>
                </form>

                <!-- Status Console / Alert Box -->
                <div id="formStatusBox" class="mt-6 p-4 rounded-xl hidden border transition-all">
                    <div class="flex items-start gap-3">
                        <div id="statusIcon" class="text-xl mt-0.5"></div>
                        <div>
                            <h4 id="statusTitle" class="font-bold text-sm"></h4>
                            <p id="statusMessage" class="text-xs mt-0.5"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
        <p>Web Development Assignment • Built with Vanilla JS & Tailwind CSS</p>
    </footer>

    <!-- External Script & Data Files -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
